# Dependabot configuration file

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Group eslint until eslint-plugin-react adds support for v10
      eslint:
        patterns:
          - "@eslint/js"
          - "eslint"
      # Group typescript until typescript-eslint adds support for v7
      typescript:
        patterns:
          - "typescript-eslint"
          - "typescript"
      updates:
        patterns: ["*"]

  # Check for updates to GitHub Actions every week
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
